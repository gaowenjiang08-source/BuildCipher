<svg width="1600" height="920" viewBox="0 0 1600 920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1600" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAF6EF"/>
      <stop offset="1" stop-color="#F0E9DC"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#7C6A52" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 800 34px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #17322B; }
      .subtitle { font: 500 18px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #60706A; }
      .section { font: 800 24px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #17322B; }
      .label { font: 800 18px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #17322B; }
      .body { font: 500 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #60706A; }
      .small { font: 700 14px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #17322B; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="url(#bg2)"/>

  <rect x="48" y="40" width="1504" height="140" rx="28" fill="#FFFDF9" stroke="#DCCFBE" filter="url(#shadow2)"/>
  <text x="88" y="94" class="title">MedCipher Studio 论文主图 V2：分层式 Agent 架构</text>
  <text x="88" y="130" class="subtitle">这张图不强调时间顺序，而强调系统“谁负责思考、谁负责执行、谁负责记忆与回放”。</text>

  <g filter="url(#shadow2)">
    <rect x="84" y="226" width="1432" height="184" rx="28" fill="#FFF3E9" stroke="#F1D3C4"/>
    <text x="116" y="274" class="section">第一层：认知决策层</text>
    <text x="116" y="304" class="body">真正带有 LLM 判断能力的部分，负责提出方案、审查方案、选择攻击路径、评估漏洞和制定补丁。</text>

    <rect x="116" y="330" width="204" height="56" rx="18" fill="#FFFFFF" stroke="#F1D3C4"/>
    <rect x="346" y="330" width="204" height="56" rx="18" fill="#FFFFFF" stroke="#F1D3C4"/>
    <rect x="576" y="330" width="204" height="56" rx="18" fill="#FFFFFF" stroke="#F1D3C4"/>
    <rect x="806" y="330" width="204" height="56" rx="18" fill="#FFFFFF" stroke="#F1D3C4"/>
    <rect x="1036" y="330" width="204" height="56" rx="18" fill="#FFFFFF" stroke="#F1D3C4"/>
    <rect x="1266" y="330" width="204" height="56" rx="18" fill="#FFFFFF" stroke="#F1D3C4"/>

    <text x="144" y="364" class="small">需求分析 Agent</text>
    <text x="380" y="364" class="small">生成 Agent</text>
    <text x="610" y="364" class="small">审计 Agent</text>
    <text x="838" y="364" class="small">攻击 Agent</text>
    <text x="1066" y="364" class="small">评估 Agent</text>
    <text x="1292" y="364" class="small">修补 / 反思 Agent</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="84" y="448" width="1432" height="184" rx="28" fill="#ECF7F3" stroke="#CFE6DD"/>
    <text x="116" y="496" class="section">第二层：系统执行层</text>
    <text x="116" y="526" class="body">不负责“思考”，负责检索、上下文组织、沙盒部署、模拟服务器运行、工件记录和交付汇总。</text>

    <rect x="116" y="552" width="204" height="56" rx="18" fill="#FFFFFF" stroke="#CFE6DD"/>
    <rect x="346" y="552" width="204" height="56" rx="18" fill="#FFFFFF" stroke="#CFE6DD"/>
    <rect x="576" y="552" width="204" height="56" rx="18" fill="#FFFFFF" stroke="#CFE6DD"/>
    <rect x="806" y="552" width="204" height="56" rx="18" fill="#FFFFFF" stroke="#CFE6DD"/>
    <rect x="1036" y="552" width="204" height="56" rx="18" fill="#FFFFFF" stroke="#CFE6DD"/>
    <rect x="1266" y="552" width="204" height="56" rx="18" fill="#FFFFFF" stroke="#CFE6DD"/>

    <text x="144" y="586" class="small">知识检索模块</text>
    <text x="366" y="586" class="small">上下文组织模块</text>
    <text x="606" y="586" class="small">沙盒调度器</text>
    <text x="842" y="586" class="small">模拟服务器</text>
    <text x="1060" y="586" class="small">工件与遥测模块</text>
    <text x="1298" y="586" class="small">交付输出模块</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="84" y="670" width="1432" height="184" rx="28" fill="#EAF0F8" stroke="#D4E0EE"/>
    <text x="116" y="718" class="section">第三层：记忆与回放层</text>
    <text x="116" y="748" class="body">负责独立上下文窗口、结构化交接、项目记忆、时间线回放、证据索引，以及下一轮优化入口。</text>

    <rect x="116" y="774" width="204" height="56" rx="18" fill="#FFFFFF" stroke="#D4E0EE"/>
    <rect x="346" y="774" width="204" height="56" rx="18" fill="#FFFFFF" stroke="#D4E0EE"/>
    <rect x="576" y="774" width="204" height="56" rx="18" fill="#FFFFFF" stroke="#D4E0EE"/>
    <rect x="806" y="774" width="204" height="56" rx="18" fill="#FFFFFF" stroke="#D4E0EE"/>
    <rect x="1036" y="774" width="204" height="56" rx="18" fill="#FFFFFF" stroke="#D4E0EE"/>
    <rect x="1266" y="774" width="204" height="56" rx="18" fill="#FFFFFF" stroke="#D4E0EE"/>

    <text x="136" y="808" class="small">独立上下文窗口</text>
    <text x="378" y="808" class="small">结构化交接包</text>
    <text x="614" y="808" class="small">项目级记忆</text>
    <text x="846" y="808" class="small">时间线回放</text>
    <text x="1068" y="808" class="small">证据引用索引</text>
    <text x="1296" y="808" class="small">下轮优化入口</text>
  </g>

  <line x1="800" y1="410" x2="800" y2="448" stroke="#7B8C86" stroke-width="5"/>
  <line x1="800" y1="632" x2="800" y2="670" stroke="#7B8C86" stroke-width="5"/>

  <rect x="84" y="874" width="1432" height="24" rx="12" fill="#17322B"/>
  <text x="88" y="902" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#F7F3EC">
    外行解释法：上层是“会思考的专家”，中层是“安全实验平台”，下层是“会记住并能回看的项目大脑”。
  </text>
</svg>

<svg width="1680" height="1040" viewBox="0 0 1680 1040" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1680" y2="1040" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF7F0"/>
      <stop offset="1" stop-color="#F1E9DC"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#7C6A52" flood-opacity="0.14"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8D857B"/>
    </marker>

    <style>
      .title { font: 800 34px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #17322B; }
      .subtitle { font: 500 18px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #60706A; }
      .section { font: 800 20px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #17322B; }
      .label { font: 800 18px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #17322B; }
      .body { font: 500 14px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #60706A; }
      .small { font: 700 14px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #17322B; }
      .chip { font: 800 14px 'Microsoft YaHei', 'PingFang SC', sans-serif; }
    </style>
  </defs>

  <rect width="1680" height="1040" fill="url(#bg)"/>

  <rect x="44" y="36" width="1592" height="148" rx="28" fill="#FFFDF9" stroke="#DCCFBE" filter="url(#shadow)"/>
  <text x="84" y="90" class="title">BuildCipher 论文主图 V1：多元素闭环流程图</text>
  <text x="84" y="126" class="subtitle">这版强调“节点更细、路径更完整、箭头更清楚”。适合答辩第一页或论文主图，直接讲清系统如何从需求走到交付，再回流下一轮优化。</text>

  <rect x="84" y="146" width="144" height="28" rx="14" fill="#F8DFD1"/>
  <text x="108" y="165" class="chip" fill="#B95C34">橙色：Agent</text>
  <rect x="244" y="146" width="154" height="28" rx="14" fill="#DFF1EA"/>
  <text x="268" y="165" class="chip" fill="#2D7B6C">绿色：系统模块</text>
  <rect x="414" y="146" width="162" height="28" rx="14" fill="#E7EEF7"/>
  <text x="438" y="165" class="chip" fill="#58738F">蓝灰：记忆/回放</text>
  <rect x="592" y="146" width="136" height="28" rx="14" fill="#F5ECCA"/>
  <text x="616" y="165" class="chip" fill="#A47B2A">金色：交付</text>

  <text x="84" y="236" class="section">主链路</text>

  <g filter="url(#shadow)">
    <rect x="78" y="272" width="180" height="96" rx="22" fill="#ECF7F3" stroke="#CFE6DD"/>
    <text x="102" y="312" class="label">业务需求</text>
    <text x="102" y="338" class="body">场景、目标、约束、</text>
    <text x="102" y="358" class="body">交付要求</text>

    <rect x="308" y="272" width="180" height="96" rx="22" fill="#ECF7F3" stroke="#CFE6DD"/>
    <text x="332" y="312" class="label">企业知识检索</text>
    <text x="332" y="338" class="body">知识库、RAG、论文、</text>
    <text x="332" y="358" class="body">规则与历史项目</text>

    <rect x="538" y="272" width="180" height="96" rx="22" fill="#FFF2E8" stroke="#F1D2C2"/>
    <text x="562" y="312" class="label">生成 Agent</text>
    <text x="562" y="338" class="body">生成候选方案、</text>
    <text x="562" y="358" class="body">伪代码与实现思路</text>

    <rect x="768" y="272" width="180" height="96" rx="22" fill="#FFF2E8" stroke="#F1D2C2"/>
    <text x="792" y="312" class="label">审计 Agent</text>
    <text x="792" y="338" class="body">检查设计风险、</text>
    <text x="792" y="358" class="body">实现漏洞与合规性</text>

    <rect x="998" y="272" width="180" height="96" rx="22" fill="#ECF7F3" stroke="#CFE6DD"/>
    <text x="1022" y="312" class="label">目标服务部署器</text>
    <text x="1022" y="338" class="body">把方案部署为</text>
    <text x="1022" y="358" class="body">可攻击模拟服务</text>

    <rect x="1228" y="272" width="180" height="96" rx="22" fill="#ECF7F3" stroke="#CFE6DD"/>
    <text x="1252" y="312" class="label">沙盒调度器</text>
    <text x="1252" y="338" class="body">控制预算、权限、</text>
    <text x="1252" y="358" class="body">执行边界</text>

    <rect x="1458" y="272" width="144" height="96" rx="22" fill="#EAF0F8" stroke="#D4E0EE"/>
    <text x="1482" y="312" class="label">独立上下文</text>
    <text x="1482" y="338" class="body">按角色分配</text>
    <text x="1482" y="358" class="body">输入窗口</text>
  </g>

  <line x1="258" y1="320" x2="308" y2="320" stroke="#8D857B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="488" y1="320" x2="538" y2="320" stroke="#8D857B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="718" y1="320" x2="768" y2="320" stroke="#8D857B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="948" y1="320" x2="998" y2="320" stroke="#8D857B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1178" y1="320" x2="1228" y2="320" stroke="#8D857B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1408" y1="320" x2="1458" y2="320" stroke="#8D857B" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="84" y="452" class="section">攻击与修补闭环</text>

  <g filter="url(#shadow)">
    <rect x="120" y="490" width="186" height="102" rx="22" fill="#FFF2E8" stroke="#F1D2C2"/>
    <text x="146" y="532" class="label">攻击 Agent</text>
    <text x="146" y="560" class="body">动态决定攻击路径、</text>
    <text x="146" y="580" class="body">继续还是换策略</text>

    <rect x="372" y="490" width="186" height="102" rx="22" fill="#ECF7F3" stroke="#CFE6DD"/>
    <text x="398" y="532" class="label">模拟服务器</text>
    <text x="398" y="560" class="body">承接请求，暴露</text>
    <text x="398" y="580" class="body">异常行为与差异</text>

    <rect x="624" y="490" width="186" height="102" rx="22" fill="#ECF7F3" stroke="#CFE6DD"/>
    <text x="650" y="532" class="label">流量与工件采集</text>
    <text x="650" y="560" class="body">日志、指标、漏洞证据、</text>
    <text x="650" y="580" class="body">攻击轨迹</text>

    <rect x="876" y="490" width="186" height="102" rx="22" fill="#FFF2E8" stroke="#F1D2C2"/>
    <text x="902" y="532" class="label">评估 Agent</text>
    <text x="902" y="560" class="body">判断漏洞是否成立、</text>
    <text x="902" y="580" class="body">严重度与优先级</text>

    <rect x="1128" y="490" width="186" height="102" rx="22" fill="#FFF2E8" stroke="#F1D2C2"/>
    <text x="1154" y="532" class="label">修补 Agent</text>
    <text x="1154" y="560" class="body">生成补丁、验证步骤、</text>
    <text x="1154" y="580" class="body">回滚说明</text>

    <rect x="1380" y="490" width="186" height="102" rx="22" fill="#ECF7F3" stroke="#CFE6DD"/>
    <text x="1406" y="532" class="label">回归验证</text>
    <text x="1406" y="560" class="body">重新部署并复测，</text>
    <text x="1406" y="580" class="body">确认问题已修复</text>
  </g>

  <line x1="306" y1="542" x2="372" y2="542" stroke="#8D857B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="558" y1="542" x2="624" y2="542" stroke="#8D857B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="810" y1="542" x2="876" y2="542" stroke="#8D857B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1062" y1="542" x2="1128" y2="542" stroke="#8D857B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1314" y1="542" x2="1380" y2="542" stroke="#8D857B" stroke-width="4" marker-end="url(#arrow)"/>

  <path d="M1474 592 C1474 660, 260 660, 260 610" stroke="#8D857B" stroke-width="4" stroke-dasharray="10 8" fill="none" marker-end="url(#arrow)"/>
  <text x="764" y="648" class="small">若回归失败，系统会回到攻击 / 评估 / 修补链继续迭代</text>

  <text x="84" y="724" class="section">记忆、回放与交付</text>

  <g filter="url(#shadow)">
    <rect x="150" y="760" width="220" height="110" rx="24" fill="#EAF0F8" stroke="#D4E0EE"/>
    <text x="178" y="804" class="label">结构化交接</text>
    <text x="178" y="832" class="body">不同 Agent 之间传递摘要、</text>
    <text x="178" y="852" class="body">证据和工件引用</text>

    <rect x="436" y="760" width="220" height="110" rx="24" fill="#EAF0F8" stroke="#D4E0EE"/>
    <text x="464" y="804" class="label">项目级记忆</text>
    <text x="464" y="832" class="body">沉淀漏洞经验、补丁经验、</text>
    <text x="464" y="852" class="body">剩余风险和反思</text>

    <rect x="722" y="760" width="220" height="110" rx="24" fill="#EAF0F8" stroke="#D4E0EE"/>
    <text x="750" y="804" class="label">时间线回放</text>
    <text x="750" y="832" class="body">记录谁做了什么、</text>
    <text x="750" y="852" class="body">证据从哪里来</text>

    <rect x="1008" y="760" width="220" height="110" rx="24" fill="#FBF6E3" stroke="#E8DDAF"/>
    <text x="1036" y="804" class="label">中文交付输出</text>
    <text x="1036" y="832" class="body">报告、伪代码、</text>
    <text x="1036" y="852" class="body">Python/C++ 实现</text>

    <rect x="1294" y="760" width="220" height="110" rx="24" fill="#DFF1EA" stroke="#CFE6DD"/>
    <text x="1322" y="804" class="label">下一轮优化入口</text>
    <text x="1322" y="832" class="body">把本轮经验回灌给</text>
    <text x="1322" y="852" class="body">生成与审计阶段</text>
  </g>

  <line x1="370" y1="814" x2="436" y2="814" stroke="#8D857B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="656" y1="814" x2="722" y2="814" stroke="#8D857B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="942" y1="814" x2="1008" y2="814" stroke="#8D857B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1228" y1="814" x2="1294" y2="814" stroke="#8D857B" stroke-width="4" marker-end="url(#arrow)"/>

  <path d="M1404 760 C1404 716, 1528 716, 1528 368" stroke="#5C7593" stroke-width="5" stroke-dasharray="10 8" fill="none" marker-end="url(#arrow)"/>
  <text x="1340" y="702" class="small">经验回流到上游认知链</text>

  <rect x="44" y="948" width="1592" height="52" rx="20" fill="#17322B"/>
  <text x="78" y="980" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#F7F3EC">
    这一版更适合你说的“论文主图风”：节点更细、箭头更强、流程更完整，外行也能顺着箭头看懂系统怎么跑。
  </text>
</svg>
